<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASA Space Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --nasa-blue: #0b3d91;
    --nasa-red: #fc3d21;
    --ink: #112e51;
    --text: #212121;
    --muted: #4a4a4a;
    --bg: #f1f1f1;
    --card: #fff;
    --line: #dcdee0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Public Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header { text-align: center; padding: 18px 16px 8px; }
  .brand { display: inline-flex; align-items: center; gap: 14px; }
  .worm {
    font-size: 44px; font-weight: 800; color: var(--nasa-red);
    letter-spacing: -2px; line-height: 1; font-style: italic;
  }
  .brand h1 { margin: 0; font-size: 24px; font-weight: 600; color: #222; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin: 22px 16px 24px;
  }
  .controls input[type="date"] {
    font: 500 13px "Public Sans", sans-serif; color: var(--muted);
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px;
    background: #fff; letter-spacing: .04em;
  }
  .controls button {
    font: 600 13px "Public Sans", sans-serif; color: #fff;
    background: var(--nasa-blue); border: 0; border-radius: 4px;
    padding: 10px 14px; cursor: pointer;
  }
  .controls button:hover { background: #082a66; }
  button:focus-visible, input:focus-visible, .card:focus-visible {
    outline: 3px solid #2491ff; outline-offset: 2px;
  }

  main { max-width: 1000px; margin: 0 auto; padding: 0 16px 48px; }

  .fact {
    background: #fff; border-left: 5px solid var(--nasa-red);
    border-radius: 6px; padding: 14px 18px; margin: 0 0 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .fact strong { color: var(--nasa-blue); }

  .status { text-align: center; padding: 48px 16px; font-size: 18px; color: var(--ink); }
  .status.error { color: #b50909; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border-radius: 8px; padding: 6px 6px 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1); cursor: pointer; text-align: left;
    border: 0; font: inherit; color: inherit;
  }
  .thumb { position: relative; overflow: hidden; border-radius: 4px; aspect-ratio: 16/9; background: #000; }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .35s ease;
  }
  .card:hover .thumb img { transform: scale(1.08); }
  .badge {
    position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.75); color: #fff;
    font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 3px;
  }
  .video-ph {
    width: 100%; height: 100%; display: grid; place-items: center;
    color: #fff; font-size: 40px; background: linear-gradient(135deg, #0b3d91, #000);
  }
  .card h2 { margin: 12px 6px 6px; font-size: 17px; font-weight: 700; line-height: 1.3; color: var(--ink); }
  .card time { display: block; margin: 0 6px; font-size: 13px; color: var(--muted); }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: none; align-items: flex-start; justify-content: center;
    padding: 24px 12px; overflow-y: auto; z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 8px; max-width: 860px; width: 100%;
    position: relative; overflow: hidden;
  }
  .modal-media { background: #000; }
  .modal-media img { width: 100%; max-height: 70vh; object-fit: contain; display: block; }
  .modal-media iframe { width: 100%; aspect-ratio: 16/9; border: 0; display: block; }
  .modal-body { padding: 20px 24px 28px; }
  .modal-body h2 { margin: 0 0 4px; font-size: 24px; color: var(--ink); }
  .modal-body time { color: var(--muted); font-size: 14px; }
  .modal-body p { line-height: 1.6; max-width: 70ch; margin: 16px 0 0; }
  .modal-body a { color: var(--nasa-blue); font-weight: 600; }
  .close {
    position: absolute; top: 10px; right: 10px; width: 36px; height: 36px;
    border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff;
    font-size: 22px; line-height: 1; cursor: pointer; z-index: 1;
  }
  .close:hover { background: var(--nasa-red); }

  @media (prefers-reduced-motion: reduce) {
    .thumb img { transition: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="worm" aria-label="NASA">NASA</span>
    <h1>Space Explorer</h1>
  </div>
  <div class="controls">
    <input type="date" id="start" aria-label="Start date" value="2025-04-17">
    <input type="date" id="end" aria-label="End date" value="2025-04-25">
    <button id="fetchBtn" type="button">Get Space Images</button>
  </div>
</header>

<main>
  <div class="fact" id="fact"></div>
  <div id="status" class="status" role="status"></div>
  <section class="gallery" id="gallery" aria-label="Space image gallery"></section>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <button class="close" id="closeBtn" aria-label="Close">&times;</button>
    <div class="modal-media" id="mMedia"></div>
    <div class="modal-body">
      <h2 id="mTitle"></h2>
      <time id="mDate"></time>
      <p id="mText"></p>
      <p id="mLink"></p>
    </div>
  </div>
</div>

<script>
  const API_KEY = "ww7QzHHG7jhCqkpFFcP6wcgqM9cwRkGqFBBddqFp";
  const API_URL = "https://api.nasa.gov/planetary/apod";

  const facts = [
    "A day on Venus is longer than its year.",
    "Neutron stars can spin over 600 times per second.",
    "Saturn is less dense than water, so it would float in a big enough bathtub.",
    "Light from the Sun takes about 8 minutes and 20 seconds to reach Earth.",
    "There are more stars in the universe than grains of sand on all Earth's beaches.",
    "Footprints on the Moon can last millions of years because there is no wind.",
    "Jupiter's Great Red Spot is a storm that has raged for at least 150 years.",
    "One teaspoon of a neutron star would weigh about a billion tons.",
    "The Milky Way and Andromeda galaxies are on a collision course, due in about 4.5 billion years.",
    "Space is completely silent because sound needs a medium to travel through."
  ];

  const $ = id => document.getElementById(id);
  const startEl = $("start"), endEl = $("end"), statusEl = $("status"), gallery = $("gallery");
  let items = [];

  $("fact").innerHTML = "<strong>🚀 Did You Know?</strong> " + facts[Math.floor(Math.random() * facts.length)];

  // Parse YYYY-MM-DD as a local date so it doesn't shift a day.
  function fmt(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  }
  function esc(s) {
    const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML;
  }

  async function loadGallery() {
    const start = startEl.value, end = endEl.value;
    gallery.innerHTML = "";
    statusEl.className = "status";
    if (!start || !end) { statusEl.textContent = "Please choose a start and end date."; return; }
    if (start > end) { statusEl.className = "status error"; statusEl.textContent = "The start date must come before the end date."; return; }

    const days = (new Date(end) - new Date(start)) / 86400000 + 1;
    if (days > 31) { statusEl.className = "status error"; statusEl.textContent = `That range is ${days} days. Please pick 31 days or fewer.`; return; }

    statusEl.textContent = "🔄 Loading space photos…";
    try {
      const url = `${API_URL}?api_key=${API_KEY}&start_date=${start}&end_date=${end}&thumbs=true`;
      // NASA's server sometimes returns 500/503, so retry a few times before giving up.
      let res;
      for (let attempt = 1; attempt <= 3; attempt++) {
        res = await fetch(url, { cache: "no-store" });
        if (res.status < 500) break;
        statusEl.textContent = `🔄 NASA's server is busy. Retrying (${attempt}/3)…`;
        await new Promise(r => setTimeout(r, 1500 * attempt));
      }
      if (res.status >= 500) {
        throw new Error("NASA's server is having trouble right now. Try a shorter date range or try again in a minute.");
      }
      if (!res.ok) {
        let msg = `NASA returned an error (${res.status}).`;
        try { const j = await res.json(); if (j.msg) msg = j.msg; else if (j.error?.message) msg = j.error.message; } catch {}
        throw new Error(msg);
      }
      items = await res.json();
      if (!Array.isArray(items)) items = [items];
      console.log("APOD request:", url, "→", items.map(x => x.date + " | " + x.title));
      statusEl.textContent = "";
      if (!items.length) { statusEl.textContent = "No images found for those dates."; return; }
      render();
    } catch (err) {
      statusEl.className = "status error";
      statusEl.textContent = "Couldn't load images: " + err.message;
    }
  }

  function thumbFor(it) {
    if (it.media_type === "image") return it.url;
    return it.thumbnail_url || "";
  }

  function render() {
    gallery.innerHTML = items.map((it, i) => {
      const src = thumbFor(it);
      const isVideo = it.media_type === "video";
      const media = src
        ? `<img src="${esc(src)}" alt="${esc(it.title)}" loading="lazy">`
        : `<div class="video-ph">▶</div>`;
      return `<button class="card" data-i="${i}" type="button">
        <div class="thumb">${media}${isVideo ? '<span class="badge">▶ Video</span>' : ""}</div>
        <h2>${esc(it.title)}</h2>
        <time datetime="${esc(it.date)}">${fmt(it.date)}</time>
      </button>`;
    }).join("");
  }

  function openModal(i) {
    const it = items[i];
    const media = $("mMedia");
    if (it.media_type === "image") {
      media.innerHTML = `<img src="${esc(it.hdurl || it.url)}" alt="${esc(it.title)}">`;
      $("mLink").innerHTML = "";
    } else if (/youtube\.com\/embed|player\.vimeo\.com/.test(it.url)) {
      media.innerHTML = `<iframe src="${esc(it.url)}" title="${esc(it.title)}" allowfullscreen></iframe>`;
      $("mLink").innerHTML = "";
    } else {
      media.innerHTML = it.thumbnail_url ? `<img src="${esc(it.thumbnail_url)}" alt="${esc(it.title)}">` : "";
      $("mLink").innerHTML = `<a href="${esc(it.url)}" target="_blank" rel="noopener">▶ Watch this video</a>`;
    }
    $("mTitle").textContent = it.title;
    $("mDate").textContent = fmt(it.date);
    $("mText").textContent = it.explanation;
    $("overlay").classList.add("open");
    document.body.style.overflow = "hidden";
    $("closeBtn").focus();
  }

  function closeModal() {
    $("overlay").classList.remove("open");
    $("mMedia").innerHTML = ""; // stops any playing video
    document.body.style.overflow = "";
  }

  $("fetchBtn").addEventListener("click", loadGallery);
  gallery.addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (card) openModal(+card.dataset.i);
  });
  $("closeBtn").addEventListener("click", closeModal);
  $("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  loadGallery();
</script>
</body>
</html>
